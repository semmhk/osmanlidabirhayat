import javax.net.ssl.*
import java.security.SecureRandom
import java.security.cert.X509Certificate

def nullTrustManager = [
    checkClientTrusted: { chain, authType -> },
    checkServerTrusted: { chain, authType -> },
    getAcceptedIssuers: { null }
] as X509TrustManager

try {
    def sslContext = SSLContext.getInstance("SSL")
    sslContext.init(null, [nullTrustManager] as TrustManager[], new SecureRandom())
    HttpsURLConnection.setDefaultSSLSocketFactory(sslContext.getSocketFactory())
    HttpsURLConnection.setDefaultHostnameVerifier({ hostname, session -> true } as HostnameVerifier)
    println("Gradle Init: Programmatic SSL verification bypassed successfully!")
} catch (Exception e) {
    println("Gradle Init SSL Bypass Exception: " + e)
}
